services:
  # 1. GeoTrack Go Backend REST API & WebSocket Hub
  - type: web
    name: geotrack-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /geofences
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: geotrack-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: WS_ALLOWED_ORIGINS
        value: "*"

  # 2. GeoTrack Frontend React Dashboard
  - type: web
    name: geotrack-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    region: oregon
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: geotrack-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL 15 Database (PostGIS auto-enabled by migration)
  - name: geotrack-db
    databaseName: geotrack
    user: postgres
    region: oregon
    plan: free
    postgresMajorVersion: 15
